name: Build Android Native Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Download & Setup OpenSSL for Android (arm64-v8a)
        run: |
          git clone https://github.com/KDAB/android_openssl.git $GITHUB_WORKSPACE/android_openssl
          mkdir -p $GITHUB_WORKSPACE/openssl_arm64/lib
          cp -r $GITHUB_WORKSPACE/android_openssl/ssl_3/include $GITHUB_WORKSPACE/openssl_arm64/
          cp $GITHUB_WORKSPACE/android_openssl/ssl_3/arm64-v8a/* $GITHUB_WORKSPACE/openssl_arm64/lib/
          cd $GITHUB_WORKSPACE/openssl_arm64/lib
          ln -sf libcrypto_3.so libcrypto.so
          ln -sf libssl_3.so libssl.so

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DOPENSSL_ROOT_DIR=$GITHUB_WORKSPACE/openssl_arm64 \
            -DOPENSSL_INCLUDE_DIR=$GITHUB_WORKSPACE/openssl_arm64/include \
            -DOPENSSL_CRYPTO_LIBRARY=$GITHUB_WORKSPACE/openssl_arm64/lib/libcrypto_3.so \
            -DOPENSSL_SSL_LIBRARY=$GITHUB_WORKSPACE/openssl_arm64/lib/libssl_3.so

      - name: Build Project
        run: |
          cd build
          make -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a-binary
          path: build/

