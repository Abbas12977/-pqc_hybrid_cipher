name: Build PQC Native for Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: تجهيز أدوات الـ NDK للأندرويد
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: جلب وبناء مكتبة liboqs للأندرويد (arm64-v8a)
        run: |
          git clone --depth=1 https://github.com/open-quantum-safe/liboqs.git
          
          # بناء liboqs مع تخصيصها لمعمارية الأندرويد عبر الـ Toolchain
          cmake -S liboqs -B liboqs/build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DBUILD_SHARED_LIBS=OFF \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build liboqs/build --parallel $(nproc)

      - name: جلب وتجهيز OpenSSL للأندرويد
        run: |
          git clone https://github.com/KDAB/android_openssl.git $GITHUB_WORKSPACE/android_openssl
          mkdir -p $GITHUB_WORKSPACE/openssl_arm64/lib
          cp -r $GITHUB_WORKSPACE/android_openssl/ssl_3/include $GITHUB_WORKSPACE/openssl_arm64/
          cp $GITHUB_WORKSPACE/android_openssl/ssl_3/arm64-v8a/* $GITHUB_WORKSPACE/openssl_arm64/lib/
          cd $GITHUB_WORKSPACE/openssl_arm64/lib
          ln -sf libcrypto_3.so libcrypto.so
          ln -sf libssl_3.so libssl.so

      - name: تكوين وبناء مشروعك (CMake)
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DOQS_ROOT_DIR=$GITHUB_WORKSPACE/liboqs/build \
            -DOPENSSL_ROOT_DIR=$GITHUB_WORKSPACE/openssl_arm64 \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build . --parallel $(nproc)

      - name: ضغط النواتج ورفعها كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pqc-android-arm64-binary
          path: |
            build/pqc_tool
            build/libpqc_crypto.a
